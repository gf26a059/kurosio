<script>
'use strict';
const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');

const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const BK=Object.keys(BI),akey=(a,b)=>[a,b].sort().join('+'),ADV={},MEL=new Set(['melee','roam','top']),rBase=()=>BK[Math.random()*BK.length|0];
[['fin','fin','疾鰭帯','当たるたび攻撃速度 +1%（波中・最大+90%）'],['fang','fin','嵐の牙','当たるたび攻撃 +1%（波中・最大+100%）'],['fin','harp','射出器','波の最初10秒、攻撃速度 +60%'],
 ['fin','shell','追い星','当てた敵を脆弱に（被ダメ+25%・2秒）'],['fin','flower','花咲く鰭','命が70%以上の間、攻撃 +40%'],['fin','glow','流星鰭','ゲージ技を撃つと表の全員の攻撃速度 +20%（4秒）'],
 ['fang','fang','星砕きの刀','攻撃 +60%（近接なら +90%）'],['fang','harp','武器の達人','表の全員の攻撃 +12%'],['fang','shell','高周波鋸','会心率 +25%・会心ダメージ +30%'],
 ['fang','flower','修羅','この波で5体倒すと攻撃 +40%'],['fang','glow','進化手帳','★1つごとに攻撃と攻撃速度 +12%'],['harp','harp','天基砲','近接以外なら攻撃 +60%・射程範囲 +30%'],
 ['harp','shell','狙撃眼','近接以外なら会心率 +30%。会心で敵を脆弱に'],['flower','harp','防壁銃','波の始めと15秒ごとに、プレイヤーに殻 +15'],['glow','harp','首狩り','ボス・中ボスへのダメージ +50%'],
 ['shell','shell','賽子','波ごとに、ランダムな上級装備の効果を2つ得る'],['flower','shell','熱血拳','最大命100を超えた10ごとに会心率 +3%'],['glow','shell','勝利の旗','表の全員の会心率 +10%'],
 ['flower','flower','生命の輪','プレイヤー最大命 +30'],['flower','glow','絶対カロリー','当たると命 +1（0.6秒に1回）'],['glow','glow','永久機関','波の始めにゲージ満タン・技3回ごとに満タン。ゲージ無しなら攻撃速度 +25%']
].forEach(([a,b,n,d])=>ADV[akey(a,b)]={n,d,p:[a,b]});
const STN={spd:'攻撃速度',atk:'攻撃',rng:'射程範囲',crit:'会心率',hp:'最大命',g:'ゲージ'};
function itemStat(q){if(BI[q])return BI[q].st;if(ADV[q]){const o={};for(const p of ADV[q].p)for(const k in BI[p].st)o[k]=(o[k]||0)+BI[p].st[k];return o}return{}}

const escA=q=>esc(String(q)).replace(/"/g,'&quot;');
function unitTip(id,star,eq=[],row){const u=U[id],m=STAR[star-1],tg=[...new Set([...u.tags,...eq.filter(q=>q.startsWith('emb:')).map(q=>q.slice(4))])];
 const L=[`${u.n} ${'★'.repeat(star)}　◆${u.cost}`,`絆：${tg.join('・')||'すべての絆 +1'}`,`攻撃：${u.desc}`],q=[];
 if(u.dmg)q.push(`威力 ${Math.round(u.dmg*m)}`);if(u.cd)q.push(`間隔 ${u.cd}秒`);if(u.gauge)q.push(`ゲージ ${u.gauge}秒`);if(u.range)q.push(`射程 ${u.range}`);if(u.rad)q.push(`範囲 ${u.rad}`);if(u.heal)q.push(`回復 ${Math.round(u.heal*m)}`);if(star==3)q.push('攻撃速度+40%・ゲージ×1.5');
 if(q.length)L.push(q.join('　'));if(u.skd)L.push(`技（★2で解放）：${u.skd}`);L.push(`★ごとの威力倍率：${STAR.join(' / ')}`);
 L.push(`★3 覚醒：${u.a3}${star==3?'（発動中）':''}`,`★3 加護：${u.p3}${star==3?'（発動中）':''}`);
 if(row)L.push(row=='f'?'表：戦闘に出て、絆と装備が効く':'裏：戦わない。★3なら加護だけ発動');
 for(const e of eq)L.push(`装備【${iName(e)}】${iDesc(e)}`);return L.join('\n')}
function itemTip(q){const L=[iName(q),iDesc(q)];if(BI[q])L.push('合成：'+BK.map(o=>`+${BI[o].n}→${ADV[akey(q,o)].n}`).join('　'));else if(ADV[q])L.push(`材料：${ADV[q].p.map(p=>BI[p].n).join(' + ')}`);else L.push('同じ絆を持つお供には付けられない');return L.join('\n')}
function synTip(t){const z=SYN[t];return[`${t}の絆`,...z.th.map((v,i)=>`${v}体：${z.d[i]}`),'表のお供だけを数える（同じお供は1体分）',`対象：${Object.keys(U).filter(k=>U[k].tags.includes(t)).map(k=>U[k].n).join('・')}`].join('\n')}
function pasTip(k){const v=PSV[k],r=G&&G.ps?G.ps[k]||0:0;return[`${v.n}${r?' '+ROM[r]:''}`,`${v.ax}の軸：${AX[v.ax]}`,...[1,2,3].map(i=>`${ROM[i]}　${v.d(i)}${i==r?'（今）':''}`)].join('\n')}

 if(banner){const k=banner.t/banner.T,al=Math.min(1,k*4,(1-k)*6);x.globalAlpha=al;x.textBaseline='middle';const by=H*.36,ex=(1-k)*40;
  x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,by-70,W,140);x.fillStyle='#fff';x.fillRect(0,by-70,W,1);x.fillRect(0,by+70,W,1);
  x.font=`800 ${Math.min(96,W*.14)}px ${SERIF}`;x.save();x.shadowColor='#fff';x.shadowBlur=30;x.fillText(banner.big.split('').join(' '),W/2+ex-20,by-8);x.restore();
  x.font=`500 12px ${MONO}`;x.fillText(banner.sub.split('').join(' '),W/2-ex+20,by+50);x.globalAlpha=1;x.textBaseline='top'}
 /* touch */
 if(touch){x.strokeStyle='#fff';x.globalAlpha=.4;x.lineWidth=2;const ax=W-80,ay=H-90;x.beginPath();x.arc(ax,ay,44,0,TAU);x.stroke();if(atkP){x.globalAlpha=.25;x.fill()}x.globalAlpha=.7;x.textBaseline='middle';x.font=`800 30px ${SERIF}`;x.fillStyle='#fff';x.fillText('斬',ax,ay);
  if(joy){x.globalAlpha=.4;x.beginPath();x.arc(joy.x,joy.y,50,0,TAU);x.stroke();x.beginPath();x.arc(joy.x+joy.dx*50,joy.y+joy.dy*50,16,0,TAU);x.fill()}x.globalAlpha=1}
 else if(w==1&&Wv.t>22){x.textAlign='center';x.textBaseline='middle';x.globalAlpha=.75;x.font=`500 13px ${MONO}`;x.fillStyle='#fff';x.fillText('WASD 移動　／　J 斬撃（押しっぱなし可）　／　P 一時停止',W/2,H-40);x.globalAlpha=1}
 hoverTip();
 if(st=='pause'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font=`800 64px ${SERIF}`;x.fillText('一 時 停 止',W/2,H/2);x.font=`500 12px ${MONO}`;x.fillText('P で再開',W/2,H/2+60)}}

/* ---------- loop / input ---------- */
function tick(dt){T+=dt;audioTick();
 if(st=='fight'){if(hs>0)hs-=dt;else upd(slow>0?dt*.3:dt);if(slow>0)slow-=dt}
 else if(st=='title'||st=='pick')cam.x+=dt*18;
 if(st=='shop'||st=='dead')fxUpd(dt);
 if(banner&&st!='pause'&&(banner.t-=dt)<=0)banner=null;
 shake*=Math.pow(.0015,dt);if(flash>0)flash-=dt*1.6;draw()}
let last=0;function loop(n){const dt=Math.min(.05,(n-last)/1000||0);last=n;tick(dt);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.repeat&&st!='fight')return;K[k]=1;
 if(k=='m')tgMute();if(k=='f'&&!e.repeat)tgFS();
 if(st=='fight'||st=='pause'){if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k=='p'||k=='escape')st=st=='fight'?'pause':'fight';if(k=='h'&&st=='fight')fieldMend()}
 else if(st=='title'){if(k==' '||k=='enter'||k=='j'){e.preventDefault();toPick()}}
 else if(st=='pick'){if('123'.includes(k)&&k)startRun(+k-1)}
 else if(st=='lvup'){if('123'.includes(k)&&k)pickPas(+k-1)}
 else if(st=='shop'){if(k>='1'&&k<='4')buy(+k-1);else if(k=='t'&&sel>=0)mv(sel);else if(k=='v'&&sel>=0)sell(sel);else if(k=='r')reroll();else if(k=='b')box();else if(k=='escape'){selItem=-1;sel=-1;renderShop()}else if(k=='x')buyXp();else if(k=='h')mend();else if(k=='enter'){e.preventDefault();sortie()}}
 else if(st=='dead'){if(k=='enter'){e.preventDefault();toPick()}}});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0;mouseAtk=false;if(st=='fight')st='pause'});
c.addEventListener('pointerdown',e=>{if(st=='pause'){st='fight';return}if(st!='fight')return;if(e.pointerType=='mouse'){mouseAtk=true;return}
 if(e.clientX<W*.5&&!joy)joy={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};else{atkId=e.pointerId;atkP=true}});
addEventListener('pointermove',e=>{if(joy&&e.pointerId==joy.id){let dx=e.clientX-joy.x,dy=e.clientY-joy.y;const d=Math.hypot(dx,dy);if(d>50){dx*=50/d;dy*=50/d}joy.dx=dx/50;joy.dy=dy/50}});
const pup=e=>{if(e.pointerType=='mouse')mouseAtk=false;if(joy&&e.pointerId==joy.id)joy=null;if(e.pointerId==atkId){atkP=false;atkId=null}};
addEventListener('pointerup',pup);addEventListener('pointercancel',pup);
c.addEventListener('contextmenu',e=>e.preventDefault());
try{TIP=document.createElement('div');TIP.id='tip';document.body.appendChild(TIP);
 document.addEventListener('mouseover',e=>{const t=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;if(!t){TIP.style.display='none';return}const q=t.getAttribute('data-tip').split('\n');TIP.innerHTML='<b>'+esc(q[0])+'</b>'+(q.length>1?'<br>'+q.slice(1).map(esc).join('<br>'):'');TIP.style.display='block';placeTip(e)});
 const placeTip=e=>{if(TIP.style.display!='block')return;const w=TIP.offsetWidth,h=TIP.offsetHeight;let x0=e.clientX+16,y0=e.clientY+16;if(x0+w>innerWidth-6)x0=e.clientX-w-12;if(y0+h>innerHeight-6)y0=Math.max(6,e.clientY-h-12);TIP.style.left=x0+'px';TIP.style.top=y0+'px'};
 document.addEventListener('mousemove',e=>{MS.x=e.clientX;MS.y=e.clientY;MS.in=1;placeTip(e)});document.addEventListener('mouseleave',()=>{MS.in=0;TIP.style.display='none'});
 document.addEventListener('mousedown',()=>{TIP.style.display='none'})}catch(e){}
requestAnimationFrame(loop);
</script></body></html>
